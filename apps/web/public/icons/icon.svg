<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Background Plate with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Center Ambient Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>

  <!-- P2P Circular Transfer Ring / Orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12" stroke-opacity="0.7"/>

  <!-- Orbiting Node A (Top-Left) -->
  <circle cx="160" cy="180" r="42" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <circle cx="160" cy="180" r="24" fill="#020617"/>
  <circle cx="160" cy="180" r="12" fill="#34d399"/>

  <!-- Orbiting Node B (Bottom-Right) -->
  <circle cx="352" cy="332" r="42" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="352" cy="332" r="24" fill="#020617"/>
  <circle cx="352" cy="332" r="12" fill="#38bdf8"/>

  <!-- Bidirectional P2P Dynamic Transfer Arrows -->
  <!-- Top Arc Arrow (Left to Right) -->
  <path d="M 195 155 A 140 140 0 0 1 330 200" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round"/>
  <polygon points="345,195 325,185 338,215" fill="#34d399" filter="url(#glow)"/>

  <!-- Bottom Arc Arrow (Right to Left) -->
  <path d="M 317 357 A 140 140 0 0 1 182 312" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round"/>
  <polygon points="167,317 187,327 174,297" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Center Glowing Spark / Core (Lightning / Sync) -->
  <polygon points="266,200 236,252 262,252 246,312 284,244 256,244" fill="#ffffff" filter="url(#glow)"/>
</svg>
